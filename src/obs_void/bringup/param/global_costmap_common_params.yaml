obstacle_range: 15.0
raytrace_range: 20.0
robot_radius: 0.25
inflation_radius: 0.2

transform_tolerance: 2.0

# Use LIO-SAM registered cloud for global costmap (for global planning)
# This provides the complete map environment consistent with localization
observation_sources: global_pointcloud

global_pointcloud:
  data_type: PointCloud2
  topic: /lio_sam/mapping/cloud_registered
  marking: true
  clearing: true
  min_obstacle_height: 0.05
  max_obstacle_height: 2.0
  obstacle_range: 15.0
  raytrace_range: 20.0

map_type: costmap
